<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Logic — Printable Puzzles</title>
<style>
  :root {
    --cream: #faf6f0;
    --warm-white: #fffdf9;
    --text: #3a3733;
    --text-light: #6b6560;
    --border: #d4cec5;
    --green: #5a7d6a;
    --green-light: #e8f0ea;
    --card-bg: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --grid-line: #b8b0a6;
    --grid-header: #f0ebe3;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--cream);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  .site-header {
    text-align: center;
    padding: 2rem 1rem 1rem;
  }
  .site-header h1 {
    font-size: 1.6rem;
    font-weight: normal;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  .site-header p {
    font-size: 0.9rem;
    color: var(--text-light);
    font-style: italic;
    margin-top: 0.25rem;
  }

  /* ── Browse Grid ── */
  .browse {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1rem;
  }
  .puzzle-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.25rem;
    cursor: pointer;
    transition: box-shadow 0.15s, transform 0.15s;
    box-shadow: var(--shadow);
  }
  .puzzle-card:hover {
    box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    transform: translateY(-1px);
  }
  .puzzle-card .num {
    font-size: 0.75rem;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.25rem;
  }
  .puzzle-card .scene {
    font-size: 1.05rem;
    font-weight: bold;
    margin-bottom: 0.15rem;
  }
  .puzzle-card .village {
    font-size: 0.8rem;
    color: var(--text-light);
    margin-bottom: 0.5rem;
  }
  .puzzle-card .meta {
    font-size: 0.78rem;
    color: var(--text-light);
  }
  .puzzle-card .meta span { margin-right: 1rem; }

  /* ── Print View ── */
  .print-view {
    display: none;
    max-width: 780px;
    margin: 0 auto;
    padding: 1rem;
  }
  .print-view.active { display: block; }

  .toolbar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .btn {
    padding: 0.5rem 1.25rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: white;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    transition: background 0.1s;
  }
  .btn:hover { background: var(--green-light); }
  .btn.primary { background: var(--green); color: white; border-color: var(--green); }
  .btn.primary:hover { opacity: 0.9; }

  /* ── Puzzle Page ── */
  .puzzle-page {
    background: white;
    padding: 2rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: var(--shadow);
  }
  .puzzle-page .puzzle-header {
    text-align: center;
    margin-bottom: 1.8rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .puzzle-page .puzzle-header h2 {
    font-size: 1.3rem;
    font-weight: normal;
  }
  .puzzle-page .puzzle-header .sub {
    font-size: 0.85rem;
    color: var(--text-light);
    font-style: italic;
    margin-top: 0.2rem;
  }
  .puzzle-page .intro {
    font-style: italic;
    margin-bottom: 1.5rem;
    color: var(--text-light);
    font-size: 0.95rem;
    line-height: 1.7;
  }

  /* ── Grid ── */
  .grid-section { margin-bottom: 1.8rem; }
  .grid-section h3 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-light);
    margin-bottom: 0.6rem;
  }
  .grid-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }
  .grid-table th, .grid-table td {
    border: 1px solid var(--grid-line);
    padding: 0.4rem 0.5rem;
    text-align: center;
  }
  .grid-table th {
    background: var(--grid-header);
    font-weight: normal;
    font-size: 0.7rem;
    color: var(--text-light);
    vertical-align: bottom;
    white-space: nowrap;
    padding: 0.3rem 0.35rem;
  }
  .grid-table .suspect-col {
    text-align: left;
    font-weight: bold;
    background: white;
    min-width: 150px;
    font-size: 0.82rem;
  }
  .grid-table .cell {
    min-width: 44px;
    height: 44px;
    position: relative;
    padding: 0.15rem;
  }
  .grid-table .cell::after {
    content: '';
    display: block;
    width: 28px;
    height: 28px;
    margin: 0 auto;
    border: 1.5px dashed #d4cec5;
    border-radius: 3px;
  }
  .cat-header {
    font-weight: bold;
    color: var(--text);
    font-size: 0.82rem;
  }

  /* ── Clues ── */
  .clues-section { margin-bottom: 1.5rem; }
  .clues-section h3 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-light);
    margin-bottom: 0.5rem;
  }
  .clue-list { list-style: none; padding:0; }
  .clue-list li {
    padding: 0.35rem 0;
    padding-left: 1.5rem;
    position: relative;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .clue-list li::before {
    content: counter(clue-counter);
    counter-increment: clue-counter;
    position: absolute;
    left: 0;
    top: 0.35rem;
    width: 1.1rem;
    height: 1.1rem;
    background: var(--green-light);
    color: var(--green);
    border-radius: 50%;
    font-size: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  .clue-section { counter-reset: clue-counter; }

  /* ── Notes Area ── */
  .notes-area {
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 1rem;
    margin-top: 1.5rem;
    min-height: 120px;
    color: var(--text-light);
    font-style: italic;
    font-size: 0.85rem;
  }

  /* ── Footer ── */
  .puzzle-footer {
    text-align: center;
    margin-top: 1.5rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--text-light);
  }
  .puzzle-footer a { color: var(--green); text-decoration: none; }

  /* ── Solution (hidden by default) ── */
  .solution-toggle {
    margin-top: 1.5rem;
    text-align: center;
  }
  .solution-box {
    display: none;
    margin-top: 1rem;
    padding: 1rem;
    background: var(--green-light);
    border-radius: 4px;
    font-size: 0.85rem;
  }
  .solution-box.visible { display: block; }
  .solution-box table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }
  .solution-box td, .solution-box th {
    padding: 0.3rem 0.5rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .solution-box th {
    font-weight: bold;
    color: var(--text);
  }

  /* ── Print styles ── */
  @media print {
    body { background: white; }
    .site-header, .toolbar, .browse, .solution-toggle, .btn { display: none !important; }
    .print-view { display: block !important; max-width: 100%; padding: 0; }
    .puzzle-page {
      box-shadow: none;
      border: none;
      padding: 0.75in 0.5in;
      page-break-after: always;
    }
    .grid-table .cell::after {
      border-color: #999;
    }
    .notes-area {
      min-height: 3in;
    }
    @page { margin: 0.3in; size: letter; }
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .browse { grid-template-columns: 1fr; }
    .puzzle-page { padding: 1rem; }
    .grid-table { font-size: 0.7rem; }
    .grid-table .suspect-col { min-width: 100px; }
    .grid-table .cell { width: 36px; height: 36px; }
    .grid-table .cell::after { width: 20px; height: 20px; }
  }
</style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <h1>🧩 Cozy Logic · Printable Puzzles</h1>
  <p>Gentle whodunits on a logic grid — print, solve with a pencil, no guessing.</p>
</header>

<!-- Browse -->
<div class="browse" id="browse"></div>

<!-- Print View -->
<div class="print-view" id="printView">
  <div class="toolbar no-print">
    <button class="btn" onclick="goBack()">← Back</button>
    <button class="btn primary" onclick="window.print()">🖨 Print</button>
    <button class="btn" id="solutionBtn" onclick="toggleSolution()">👁 Show Solution</button>
  </div>
  <div class="puzzle-page" id="puzzlePage"></div>
</div>

<script>
// ── Load puzzles ──
let puzzles = [];
let currentIndex = -1;

fetch('puzzles.json')
  .then(r => r.json())
  .then(data => {
    puzzles = data;
    renderBrowse();
  })
  .catch(err => {
    document.getElementById('browse').innerHTML = 
      '<p style="text-align:center;color:#c44;">Failed to load puzzles. Make sure puzzles.json is in the same folder.</p>';
    console.error(err);
  });

// ── Render Browse Grid ──
function renderBrowse() {
  const el = document.getElementById('browse');
  el.innerHTML = puzzles.map((p, i) => `
    <div class="puzzle-card" onclick="openPuzzle(${i})">
      <div class="num">Puzzle ${p.id}</div>
      <div class="scene">${esc(p.scene)}</div>
      <div class="village">${esc(p.village)}</div>
      <div class="meta">
        <span>🔍 ${p.clues.length} clues</span>
        <span>👤 ${p.suspects.length} suspects</span>
      </div>
    </div>
  `).join('');
}

// ── Open Puzzle ──
function openPuzzle(index) {
  currentIndex = index;
  const p = puzzles[index];
  document.getElementById('browse').style.display = 'none';
  document.querySelector('.site-header').style.display = 'none';
  document.getElementById('printView').classList.add('active');
  renderPuzzle(p);
  window.scrollTo(0, 0);
}

function goBack() {
  document.getElementById('browse').style.display = '';
  document.querySelector('.site-header').style.display = '';
  document.getElementById('printView').classList.remove('active');
  document.getElementById('solutionBox')?.classList.remove('visible');
  document.getElementById('solutionBtn').textContent = '👁 Show Solution';
  currentIndex = -1;
}

// ── Render Puzzle Page ──
function renderPuzzle(p) {
  const cats = p.categories;
  const suspects = p.suspects;
  
  // Build grid HTML
  let gridHTML = '<table class="grid-table"><thead><tr><th></th>';
  
  // Category headers with value sub-columns
  cats.forEach(cat => {
    gridHTML += `<th class="cat-header" colspan="${cat.values.length}">${esc(cat.label)}</th>`;
  });
  gridHTML += '</tr><tr><th></th>';
  cats.forEach(cat => {
    cat.values.forEach(v => {
      gridHTML += `<th>${esc(shorten(v, 18))}</th>`;
    });
  });
  gridHTML += '</tr></thead><tbody>';
  
  suspects.forEach((s, si) => {
    gridHTML += '<tr>';
    gridHTML += `<td class="suspect-col">${esc(s)}</td>`;
    cats.forEach(cat => {
      cat.values.forEach((v, vi) => {
        gridHTML += `<td class="cell"></td>`;
      });
    });
    gridHTML += '</tr>';
  });
  
  gridHTML += '</tbody></table>';
  
  // Clues
  let cluesHTML = '<ol class="clue-list clue-section">';
  p.clues.forEach(c => {
    cluesHTML += `<li>${esc(c.text)}</li>`;
  });
  cluesHTML += '</ol>';
  
  // Solution
  let solutionHTML = '<table><thead><tr><th>Suspect</th>';
  cats.forEach(cat => {
    solutionHTML += `<th>${esc(cat.label)}</th>`;
  });
  solutionHTML += '</tr></thead><tbody>';
  suspects.forEach((s, si) => {
    solutionHTML += '<tr>';
    solutionHTML += `<td><strong>${esc(s)}</strong></td>`;
    cats.forEach(cat => {
      solutionHTML += `<td>${esc(p.solution[cat.key][si])}</td>`;
    });
    solutionHTML += '</tr>';
  });
  solutionHTML += '</tbody></table>';
  
  document.getElementById('puzzlePage').innerHTML = `
    <div class="puzzle-header">
      <h2>${esc(p.scene)}</h2>
      <div class="sub">${esc(p.village)} · ${p.clues.length} clues · ${difficultyLabel(p.difficulty)}</div>
    </div>
    
    <div class="intro">${esc(p.intro)}</div>
    
    <div class="grid-section">
      <h3>The Grid</h3>
      ${gridHTML}
    </div>
    
    <div class="clues-section">
      <h3>The Clues</h3>
      ${cluesHTML}
    </div>
    
    <div class="notes-area">✎ Your notes &amp; deductions…</div>
    
    <div class="solution-toggle no-print">
      <div id="solutionBox" class="solution-box">
        <h3 style="margin-bottom:0.5rem;color:var(--green)">Solution ✓</h3>
        ${solutionHTML}
      </div>
    </div>
    
    <div class="puzzle-footer">
      Puzzle #${p.id} · <a href="https://cozylogic.store">cozylogic.store</a> · Published by Blackwick Press
    </div>
  `;
}

function toggleSolution() {
  const box = document.getElementById('solutionBox');
  const btn = document.getElementById('solutionBtn');
  if (box.classList.contains('visible')) {
    box.classList.remove('visible');
    btn.textContent = '👁 Show Solution';
  } else {
    box.classList.add('visible');
    btn.textContent = '🙈 Hide Solution';
  }
}

// ── Helpers ──
function esc(s) { 
  if (!s) return '';
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}
function shorten(s, max) { return s.length > max ? s.slice(0,max-1)+'…' : s; }
function difficultyLabel(d) { return d === 'easy' ? 'Easy' : d === 'medium' ? 'Medium' : 'Hard'; }
</script>

</body>
</html>
